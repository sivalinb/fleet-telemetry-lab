<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 730" role="img" aria-label="Scale the evidence, then scale the system."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8096ac"/></marker></defs><rect width="1280" height="730" rx="24" fill="#f1f6fc"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="12" fill="#5b738d" font-weight="700">FLEET ATLAS  /  ENGINEERING FIELD GUIDE</text><text x="48" y="96" font-family="Arial, sans-serif" font-size="34" fill="#102d4a" font-weight="700">Scale the evidence, then scale the system.</text><text x="48" y="128" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">An extension path with verification gates, not an unmeasured throughput promise.</text><rect x="48" y="190" width="1184" height="105" rx="16" fill="#fff" stroke="#d4e0ee"/><text x="73" y="251" font-family="Arial, sans-serif" font-size="32" fill="#007f86" font-weight="700">01</text><text x="153" y="232" font-family="Arial, sans-serif" font-size="23" fill="#102d4a" font-weight="700">Runnable lab</text><text x="540" y="227" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">27 entities · one API worker · full projection</text><text x="540" y="259" font-family="Arial, sans-serif" font-size="16" fill="#5b738d" font-weight="400">Prove identity, ownership, delivery, and recovery</text><rect x="48" y="315" width="1184" height="105" rx="16" fill="#fff" stroke="#d4e0ee"/><text x="73" y="376" font-family="Arial, sans-serif" font-size="32" fill="#2466be" font-weight="700">02</text><text x="153" y="357" font-family="Arial, sans-serif" font-size="23" fill="#102d4a" font-weight="700">Growing fleet</text><text x="540" y="352" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">Incremental reconciliation · bulk upserts · indexed edges</text><text x="540" y="384" font-family="Arial, sans-serif" font-size="16" fill="#5b738d" font-weight="400">Compare results to the full-rebuild oracle and measure p95</text><rect x="48" y="440" width="1184" height="105" rx="16" fill="#fff" stroke="#d4e0ee"/><text x="73" y="501" font-family="Arial, sans-serif" font-size="32" fill="#7055bb" font-weight="700">03</text><text x="153" y="482" font-family="Arial, sans-serif" font-size="23" fill="#102d4a" font-weight="700">Multiple sites and teams</text><text x="540" y="477" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">Partitioned sources · durable jobs · regional Collector gateways</text><text x="540" y="509" font-family="Arial, sans-serif" font-size="16" fill="#5b738d" font-weight="400">Prove concurrency, isolation, outage capacity, and restore</text><rect x="48" y="565" width="1184" height="105" rx="16" fill="#fff" stroke="#d4e0ee"/><text x="73" y="626" font-family="Arial, sans-serif" font-size="32" fill="#102d4a" font-weight="700">04</text><text x="153" y="607" font-family="Arial, sans-serif" font-size="23" fill="#102d4a" font-weight="700">Operational platform</text><text x="540" y="602" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">OIDC / RBAC · HA storage · migrations · measured SLOs</text><text x="540" y="634" font-family="Arial, sans-serif" font-size="16" fill="#5b738d" font-weight="400">Exercise failure boundaries before expanding the scope</text><text x="48" y="704" font-family="Arial, sans-serif" font-size="13" fill="#5b738d" font-weight="400">Queue planning: peak batches/second × outage seconds × headroom. Validate bytes, drain rate, and data loss in a load test.</text></svg>