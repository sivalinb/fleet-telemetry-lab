<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" role="img" aria-label="Know the fleet. Verify the signal."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8096ac"/></marker></defs><rect width="1280" height="980" rx="24" fill="#f1f6fc"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="12" fill="#5b738d" font-weight="700">FLEET ATLAS  /  ENGINEERING FIELD GUIDE</text><text x="48" y="96" font-family="Arial, sans-serif" font-size="34" fill="#102d4a" font-weight="700">Know the fleet. Verify the signal.</text><text x="48" y="128" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">Two Python projects, one Streamlit workspace. Fictional infrastructure; real telemetry delivery.</text><text x="48" y="179" font-family="Arial, sans-serif" font-size="14" fill="#007f86" font-weight="700">01  /  FLEET CATALOG</text><rect x="48" y="200" width="265" height="180" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="218" width="4" height="144" rx="2" fill="#007f86"/><text x="68" y="229" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">OBSERVE</text><text x="68" y="258" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Source snapshots</text><text x="68" y="285" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Service catalog ownership</text><text x="68" y="308" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Kubernetes node / service data</text><text x="68" y="331" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Redfish identity / hardware</text><rect x="365" y="200" width="265" height="180" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="366" y="218" width="4" height="144" rx="2" fill="#007f86"/><text x="385" y="229" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">RECONCILE</text><text x="385" y="258" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Python + FastAPI</text><text x="385" y="285" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Validate + replay protection</text><text x="385" y="308" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Field priority + provenance</text><text x="385" y="331" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Conflicts, freshness, absence</text><rect x="685" y="200" width="260" height="180" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="686" y="218" width="4" height="144" rx="2" fill="#007f86"/><text x="705" y="229" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">RETAIN</text><text x="705" y="258" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">SQL catalog</text><text x="705" y="285" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Sources + observations</text><text x="705" y="308" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Entities + sync runs + audit</text><text x="705" y="331" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">SQLite / PostgreSQL</text><path d="M313 286 L365 286" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 286 L685 286" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="431" font-family="Arial, sans-serif" font-size="14" fill="#2466be" font-weight="700">02  /  SIGNAL LAB</text><rect x="48" y="450" width="265" height="180" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="468" width="4" height="144" rx="2" fill="#2466be"/><text x="68" y="479" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">GENERATE</text><text x="68" y="508" font-family="Arial, sans-serif" font-size="19.841269841269842" fill="#102d4a" font-weight="700">Three Python services</text><text x="68" y="535" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Gateway → scheduler → worker</text><text x="68" y="558" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">W3C traces + structured logs</text><text x="68" y="581" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Counters + duration histograms</text><rect x="365" y="450" width="265" height="180" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="366" y="468" width="4" height="144" rx="2" fill="#2466be"/><text x="385" y="479" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">COLLECT</text><text x="385" y="508" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">OTel Collector</text><text x="385" y="535" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">OTLP / HTTP + batching</text><text x="385" y="558" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Memory limiter</text><text x="385" y="581" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Persistent log / trace queues</text><rect x="685" y="450" width="260" height="180" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="686" y="468" width="4" height="144" rx="2" fill="#2466be"/><text x="705" y="479" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">EXERCISE</text><text x="705" y="508" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Python fault relay</text><text x="705" y="535" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Time-bounded HTTP 503</text><text x="705" y="558" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Real exporter retries</text><text x="705" y="581" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Original OTLP payloads</text><path d="M313 538 L365 538" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 538 L685 538" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="685" width="265" height="165" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="703" width="4" height="129" rx="2" fill="#2466be"/><text x="68" y="714" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">MEASURE</text><text x="68" y="743" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Prometheus</text><text x="68" y="770" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Scrapes workload counters</text><text x="68" y="793" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">And Collector self-metrics</text><rect x="365" y="685" width="265" height="165" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="366" y="703" width="4" height="129" rx="2" fill="#2466be"/><text x="385" y="714" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">INVESTIGATE</text><text x="385" y="743" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Loki + Jaeger</text><text x="385" y="770" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Logs by experiment identifier</text><text x="385" y="793" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Trace chain + span duration</text><rect x="685" y="685" width="260" height="165" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="686" y="703" width="4" height="129" rx="2" fill="#2466be"/><text x="705" y="714" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">PROVE</text><text x="705" y="743" font-family="Arial, sans-serif" font-size="16.975308641975307" fill="#102d4a" font-weight="700">Python experiment runner</text><text x="705" y="770" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Assertions + bounded polling</text><text x="705" y="793" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Evidence saved to SQL</text><path d="M495 630 L185 685" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M817 630 L500 685" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 768 L685 768" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="995" y="200" width="237" height="650" rx="16" fill="#102d4a" stroke="#102d4a"/><text x="1017" y="238" font-family="Arial, sans-serif" font-size="12" fill="#80ddd7" font-weight="700">03  /  DISCOVER</text><text x="1017" y="280" font-family="Arial, sans-serif" font-size="29" fill="#fff" font-weight="700">Streamlit</text><text x="1017" y="310" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">All UI logic in Python</text><text x="1017" y="366" font-family="Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Fleet catalog</text><text x="1017" y="394" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Interactive topology</text><text x="1017" y="418" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Owner + source inspector</text><text x="1017" y="442" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Dependency exposure</text><text x="1017" y="526" font-family="Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Signal lab</text><text x="1017" y="554" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Run five experiments</text><text x="1017" y="578" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Trace / queue visuals</text><text x="1017" y="602" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Download evidence</text><text x="1017" y="686" font-family="Arial, sans-serif" font-size="20" fill="#fff" font-weight="700">Field guide</text><text x="1017" y="714" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Architecture + test cases</text><text x="1017" y="738" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Technology + tradeoffs</text><text x="1017" y="762" font-family="Arial, sans-serif" font-size="15" fill="#b5cede" font-weight="400">Scaling + extensions</text><path d="M945 286 L995 286" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M945 768 L995 768" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="909" font-family="Arial, sans-serif" font-size="12" fill="#007f86" font-weight="700">SHARED CONTEXT</text><text x="205" y="909" font-family="Arial, sans-serif" font-size="17" fill="#102d4a" font-weight="400">Canonical node, service, cluster, and owner identifiers connect the two views.</text><text x="48" y="954" font-family="Arial, sans-serif" font-size="13" fill="#5b738d" font-weight="400">Inventory models 96 GPU slots. The measured workload is CPU hashing; no GPU performance is claimed.</text></svg>