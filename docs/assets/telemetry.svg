<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 995" role="img" aria-label="Where does the signal stop?"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8096ac"/></marker></defs><rect width="1280" height="995" rx="24" fill="#f1f6fc"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="12" fill="#5b738d" font-weight="700">FLEET ATLAS  /  ENGINEERING FIELD GUIDE</text><text x="48" y="96" font-family="Arial, sans-serif" font-size="34" fill="#102d4a" font-weight="700">Where does the signal stop?</text><text x="48" y="128" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">A Python + Gradio workbench with two real telemetry paths and inspectable recovery evidence.</text><rect x="48" y="166" width="360" height="140" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="184" width="4" height="104" rx="2" fill="#007f86"/><text x="68" y="195" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">01 / CHOOSE</text><text x="68" y="224" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Gradio workbench</text><text x="68" y="251" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Nine hypotheses · live progress · cancel</text><text x="68" y="274" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Compare runs · HTML and JSON reports</text><rect x="458" y="166" width="360" height="140" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="459" y="184" width="4" height="104" rx="2" fill="#2466be"/><text x="478" y="195" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">02 / COORDINATE</text><text x="478" y="224" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Python + FastAPI</text><text x="478" y="251" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">One active run · bounded execution</text><text x="478" y="274" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Persist each phase · own subprocesses</text><rect x="868" y="166" width="364" height="140" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="869" y="184" width="4" height="104" rx="2" fill="#7055bb"/><text x="888" y="195" font-family="Arial, sans-serif" font-size="11" fill="#7055bb" font-weight="700">03 / REMEMBER</text><text x="888" y="224" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">SQL evidence</text><text x="888" y="251" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Counts · IDs · samples · assertions</text><text x="888" y="274" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Queued → running → terminal state</text><path d="M408 236 L458 236" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M818 236 L868 236" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="350" font-family="Arial, sans-serif" font-size="14" fill="#007f86" font-weight="700">MAIN PIPELINE / WORKLOAD AND INSTRUMENTATION</text><rect x="48" y="372" width="265" height="160" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="390" width="4" height="124" rx="2" fill="#007f86"/><text x="68" y="401" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">PYTHON / HTTP</text><text x="68" y="430" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Gateway → worker</text><text x="68" y="457" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Via scheduler · CPU work</text><text x="68" y="480" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">W3C context across 3 services</text><text x="68" y="503" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Traces + logs + metrics</text><rect x="365" y="372" width="265" height="160" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="366" y="390" width="4" height="124" rx="2" fill="#2466be"/><text x="385" y="401" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">OPENTELEMETRY</text><text x="385" y="430" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Main Collector</text><text x="385" y="457" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Memory limiter + batching</text><text x="385" y="480" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Persistent export queues</text><text x="385" y="503" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Prometheus scrape endpoint</text><rect x="682" y="372" width="265" height="160" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="683" y="390" width="4" height="124" rx="2" fill="#7055bb"/><text x="702" y="401" font-family="Arial, sans-serif" font-size="11" fill="#7055bb" font-weight="700">FAULT INJECTION</text><text x="702" y="430" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Main Python relay</text><text x="702" y="457" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Bounded 503 export outage</text><text x="702" y="480" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Fixed Loki / Jaeger targets</text><text x="702" y="503" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Real retry responses</text><rect x="999" y="372" width="233" height="375" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="1000" y="390" width="4" height="339" rx="2" fill="#007f86"/><text x="1019" y="401" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">QUERY ACTUAL DELIVERY</text><text x="1019" y="430" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Signal backends</text><text x="1019" y="457" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Prometheus / metrics</text><text x="1019" y="480" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Loki / logs</text><text x="1019" y="503" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Jaeger / traces</text><text x="1019" y="526" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400"></text><text x="1019" y="549" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Main + isolated paths</text><text x="1019" y="572" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">share these backends.</text><text x="1019" y="595" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400"></text><text x="1019" y="618" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Unique run IDs keep</text><text x="1019" y="641" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">evidence attributable.</text><path d="M313 452 L365 452" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><text x="314.0" y="443.0" font-family="Arial, sans-serif" font-size="12" fill="#5b738d" font-weight="400">OTLP</text><path d="M630 452 L682 452" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M947 452 L999 452" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="571" font-family="Arial, sans-serif" font-size="14" fill="#2466be" font-weight="700">ISOLATED PIPELINE / QUEUE AND PROCESS FAILURES</text><rect x="48" y="591" width="265" height="160" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="609" width="4" height="124" rx="2" fill="#007f86"/><text x="68" y="620" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">PYTHON / DIRECT OTLP</text><text x="68" y="649" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Unique probes</text><text x="68" y="676" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">One trace + log per input</text><text x="68" y="699" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Record admission / rejection</text><text x="68" y="722" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Send a canary after recovery</text><rect x="365" y="591" width="265" height="160" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="366" y="609" width="4" height="124" rx="2" fill="#2466be"/><text x="385" y="620" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">OWNED SUBPROCESS</text><text x="385" y="649" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Isolated Collector</text><text x="385" y="676" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Persistent OR memory queue</text><text x="385" y="699" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">SIGKILL · retry expiry · full queue</text><text x="385" y="722" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">No batch processor buffer</text><rect x="682" y="591" width="265" height="160" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="683" y="609" width="4" height="124" rx="2" fill="#7055bb"/><text x="702" y="620" font-family="Arial, sans-serif" font-size="11" fill="#7055bb" font-weight="700">OWNED SUBPROCESS</text><text x="702" y="649" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Isolated relay</text><text x="702" y="676" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Exports blocked then restored</text><text x="702" y="699" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Own ports and queue directory</text><text x="702" y="722" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Main Collector stays running</text><path d="M313 671 L365 671" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 671 L682 671" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M947 671 L999 671" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="802" width="360" height="138" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="820" width="4" height="102" rx="2" fill="#2466be"/><text x="68" y="831" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">MEASURE</text><text x="68" y="860" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Accepted ≠ delivered</text><text x="68" y="887" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Compare input IDs with backend IDs</text><text x="68" y="910" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Preserve unavailable values and errors</text><rect x="458" y="802" width="360" height="138" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="459" y="820" width="4" height="102" rx="2" fill="#007f86"/><text x="478" y="831" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">VERIFY</text><text x="478" y="860" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">A canary checks recovery</text><text x="478" y="887" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Missing originals + working backend</text><text x="478" y="910" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">distinguish loss from query failure</text><rect x="868" y="802" width="364" height="138" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="869" y="820" width="4" height="102" rx="2" fill="#7055bb"/><text x="888" y="831" font-family="Arial, sans-serif" font-size="11" fill="#7055bb" font-weight="700">EXPLAIN</text><text x="888" y="860" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Pass means hypothesis met</text><text x="888" y="887" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Some scenarios intentionally prove loss</text><text x="888" y="910" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">No exactly-once or GPU performance claim</text><text x="48" y="969" font-family="Arial, sans-serif" font-size="13" fill="#5b738d" font-weight="400">Real CPU / HTTP / OTLP execution · fictional fleet context · all custom application and orchestration code is Python</text></svg>