<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Crash the Collector. Keep the evidence."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8096ac"/></marker></defs><rect width="1280" height="640" rx="24" fill="#f1f6fc"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="12" fill="#5b738d" font-weight="700">FLEET ATLAS  /  ENGINEERING FIELD GUIDE</text><text x="48" y="96" font-family="Arial, sans-serif" font-size="34" fill="#102d4a" font-weight="700">Crash the Collector. Keep the evidence.</text><text x="48" y="128" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">A controlled restart test against the actual persistent exporter queues.</text><rect x="48" y="205" width="263" height="210" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="223" width="4" height="174" rx="2" fill="#2466be"/><text x="68" y="234" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">01 / BLOCK</text><text x="68" y="263" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Backend unavailable</text><text x="68" y="290" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Relay returns 503</text><text x="68" y="313" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">20 traces + 20 log events</text><rect x="355" y="205" width="263" height="210" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="356" y="223" width="4" height="174" rx="2" fill="#2466be"/><text x="375" y="234" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">02 / PERSIST</text><text x="375" y="263" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Wait for backlog</text><text x="375" y="290" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Verify accepted signals</text><text x="375" y="313" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Observe queued batches</text><rect x="662" y="205" width="263" height="210" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="663" y="223" width="4" height="174" rx="2" fill="#2466be"/><text x="682" y="234" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">03 / CRASH</text><text x="682" y="263" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Abrupt process loss</text><text x="682" y="290" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">SIGKILL owned Collector</text><text x="682" y="313" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Restart with same WAL</text><rect x="969" y="205" width="263" height="210" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="970" y="223" width="4" height="174" rx="2" fill="#007f86"/><text x="989" y="234" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">04 / RESTORE</text><text x="989" y="263" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Verify recovery</text><text x="989" y="290" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Clear injected outage</text><text x="989" y="313" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Find every unique event</text><path d="M311 305 L355 305" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M618 305 L662 305" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M925 305 L969 305" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="465" width="1184" height="100" rx="16" fill="#102d4a" stroke="#102d4a"/><text x="73" y="501" font-family="Arial, sans-serif" font-size="13" fill="#80ddd7" font-weight="700">THE GUARANTEE HAS A BOUNDARY</text><text x="73" y="535" font-family="Arial, sans-serif" font-size="17" fill="#e1edf7" font-weight="400">Only telemetry already in persistent export storage is covered by this test. Disk loss and queue limits still matter.</text><text x="48" y="614" font-family="Arial, sans-serif" font-size="13" fill="#5b738d" font-weight="400">Records are checked by unique IDs. Replay may duplicate delivery; exactly-once semantics are not claimed.</text></svg>