<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-label="A value is useful when you can explain it."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8096ac"/></marker></defs><rect width="1280" height="700" rx="24" fill="#f1f6fc"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="12" fill="#5b738d" font-weight="700">FLEET ATLAS  /  ENGINEERING FIELD GUIDE</text><text x="48" y="96" font-family="Arial, sans-serif" font-size="34" fill="#102d4a" font-weight="700">A value is useful when you can explain it.</text><text x="48" y="128" font-family="Arial, sans-serif" font-size="17" fill="#5b738d" font-weight="400">Stable identity joins observations. Field policy selects values without hiding disagreements.</text><rect x="48" y="190" width="350" height="140" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="208" width="4" height="104" rx="2" fill="#007f86"/><text x="68" y="219" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">SERVICE CATALOG</text><text x="68" y="248" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">owner = team:inference</text><text x="68" y="275" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Authoritative ownership, observed at T1</text><rect x="48" y="355" width="350" height="140" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="373" width="4" height="104" rx="2" fill="#7055bb"/><text x="68" y="384" font-family="Arial, sans-serif" font-size="11" fill="#7055bb" font-weight="700">KUBERNETES</text><text x="68" y="413" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">owner = team:platform</text><text x="68" y="440" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Conflicting ownership, observed at T2</text><rect x="48" y="520" width="350" height="110" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="49" y="538" width="4" height="74" rx="2" fill="#2466be"/><text x="68" y="549" font-family="Arial, sans-serif" font-size="11" fill="#2466be" font-weight="700">REDFISH</text><text x="68" y="578" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">serial = FTL-A11</text><text x="68" y="605" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Stable physical identity</text><path d="M398 260 L464 260" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M398 425 L464 425" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><path d="M398 570 L464 570" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="464" y="190" width="270" height="440" rx="16" fill="#102d4a" stroke="#102d4a"/><text x="488" y="232" font-family="Arial, sans-serif" font-size="13" fill="#80ddd7" font-weight="700">RECONCILIATION</text><text x="488" y="287" font-family="Arial, sans-serif" font-size="18" fill="#e1edf7" font-weight="400">1. Validate identity</text><text x="488" y="338" font-family="Arial, sans-serif" font-size="18" fill="#e1edf7" font-weight="400">2. Check batch replay</text><text x="488" y="389" font-family="Arial, sans-serif" font-size="18" fill="#e1edf7" font-weight="400">3. Reject older input</text><text x="488" y="440" font-family="Arial, sans-serif" font-size="18" fill="#e1edf7" font-weight="400">4. Apply field policy</text><text x="488" y="491" font-family="Arial, sans-serif" font-size="18" fill="#e1edf7" font-weight="400">5. Retain provenance</text><text x="488" y="542" font-family="Arial, sans-serif" font-size="18" fill="#e1edf7" font-weight="400">6. Commit atomically</text><path d="M734 410 L790 410" fill="none" stroke="#8096ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="190" width="442" height="185" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="791" y="208" width="4" height="149" rx="2" fill="#007f86"/><text x="810" y="219" font-family="Arial, sans-serif" font-size="11" fill="#007f86" font-weight="700">RESOLVED RECORD</text><text x="810" y="248" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">One entity, one chosen owner</text><text x="810" y="275" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">owner = team:inference</text><text x="810" y="298" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">provenance = service-catalog @ T1</text><text x="810" y="321" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">conflict = Kubernetes says team:platform</text><rect x="790" y="405" width="442" height="225" rx="16" fill="#fff" stroke="#d4e0ee"/><rect x="791" y="423" width="4" height="189" rx="2" fill="#7055bb"/><text x="810" y="434" font-family="Arial, sans-serif" font-size="11" fill="#7055bb" font-weight="700">HISTORY &amp; DATA QUALITY</text><text x="810" y="463" font-family="Arial, sans-serif" font-size="21" fill="#102d4a" font-weight="700">Absence is a signal</text><text x="810" y="490" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">Partial loss → source_absent</text><text x="810" y="513" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">All sources absent → unobserved</text><text x="810" y="536" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">TTL expired → source_stale</text><text x="810" y="559" font-family="Arial, sans-serif" font-size="15" fill="#5b738d" font-weight="400">References missing → visible finding</text><text x="48" y="674" font-family="Arial, sans-serif" font-size="13" fill="#5b738d" font-weight="400">A newer non-authoritative observation does not silently replace the authoritative owner.</text></svg>