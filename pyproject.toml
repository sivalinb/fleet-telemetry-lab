[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fleet-telemetry-lab"
version = "3.0.0"
description = "A Python workbench for measured OpenTelemetry delivery and failure boundaries."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "pydantic>=2.9,<3", "pyyaml>=6,<7", "gradio>=6.27,<7", "plotly>=6,<7", "pandas>=2.2,<4", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
docs = ["markdown>=3.7,<4"]
dev = ["ruff>=0.16,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
[tool.coverage.run]
source = ["fleetlab"]
