name: Verify telemetry reliability lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.lock}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pytest --junitxml=evidence/unit-tests.xml
      - run: python scripts/install_tools.py
      - run: .runtime/bin/promtool check rules observability/alerts.yaml && .runtime/bin/promtool test rules observability/alerts.test.yaml
      - name: Real backend integration and crash recovery
        run: python scripts/ci_integration.py
      - name: Summarize verification results
        if: always()
        run: python scripts/summarize_verification.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-evidence
          path: evidence/verification-summary.json
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: fleetlab, POSTGRES_PASSWORD: local-ci-only, POSTGRES_DB: fleetlab}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fleetlab" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python scripts/verify_postgres.py
        env:
          DATABASE_URL: postgresql+psycopg://fleetlab:local-ci-only@127.0.0.1/fleetlab
