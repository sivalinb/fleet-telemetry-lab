extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/fleetlab/collector
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 200ms
    send_batch_size: 256
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/traces:
    endpoint: http://relay:8200
    sending_queue:
      enabled: true
      queue_size: 2000
      num_consumers: 1
      storage: file_storage
    retry_on_failure:
      initial_interval: 1s
      max_interval: 3s
      max_elapsed_time: 60s
  otlphttp/logs:
    endpoint: http://relay:8200
    sending_queue:
      enabled: true
      queue_size: 2000
      num_consumers: 1
      storage: file_storage
    retry_on_failure:
      initial_interval: 1s
      max_interval: 3s
      max_elapsed_time: 60s
service:
  extensions: [health_check, file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/traces]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
